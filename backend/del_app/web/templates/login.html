<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1f30" media="(prefers-color-scheme: dark)" data-theme-color>
  <meta name="theme-color" content="#edf1f4" media="(prefers-color-scheme: light)" data-theme-color>
  <title>Log in · DEL</title>
  <link rel="icon" href="{{ asset('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('theme-init.js') }}"></script>
</head>
{% import "_icons.html" as i %}
<body class="login-body">
  <main class="login-card">
    <div class="login-mark" aria-hidden="true">{{ i.icon('marker') }}<span>DEL</span></div>
    <h1 class="login-title">Sign in</h1>
    <p class="muted">Application inventory and safe removal for {{ host_name }}.</p>
    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stacked-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </main>
</body>
</html>
