server {
    listen 80;
    server_name del.bjk.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name del.bjk.ai;

    ssl_certificate /etc/letsencrypt/live/bjk.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bjk.ai/privkey.pem;

    client_max_body_size 50M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The UI ships no external assets (first-party JS/CSS only, self-hosted
    # fonts, no CDN), so 'self' holds for scripts, styles and fonts. The one
    # relaxation is img-src data:, used by the /miscwork.html inventory export.
    # App icons are proxied through /app-icon/, so no third-party img origin
    # is required. NOTE: nginx's add_header is NOT inherited into a location
    # block that defines its own — none here do, but adding one means
    # repeating these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Inventory HTML export — basic-auth (contains full host inventory).
    location = /inventory { return 301 /miscwork.html; }
    location = /miscwork.html {
        auth_basic "DEL inventory";
        auth_basic_user_file /etc/nginx/.del-docs-htpasswd;
        alias /apps/del/miscwork/miscwork.html;
        default_type text/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8075;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
