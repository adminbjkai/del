port = 8075
db_path = "/apps/del/database/del.db"
manifests_dir = "/apps/del/manifests"
backups_dir = "/apps/del/backups"
logs_dir = "/apps/del/logs"
scan_roots = ["/apps", "/data/apps", "/opt", "/srv", "/var/www"]
helper_socket = "/run/del/helper.sock"
protected_apps = ["del"]

[assistant]
enabled = true
base_url = "https://ollama.com"
model = "glm-5.3-flash"
api_key_file = "/apps/del/config/ollama-api-key.txt"
timeout_seconds = 120
temperature = 0.2
think = "low"
context_budget_chars = 36000
history_messages = 12
