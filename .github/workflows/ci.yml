name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python sources
        run: pyflakes backend helper scripts tests
      - name: Run tests with warnings as errors
        working-directory: backend
        run: python -m pytest ../tests/ -q -W error

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check application JavaScript syntax
        run: |
          for f in backend/del_app/web/static/*.js; do node --check "$f"; done
